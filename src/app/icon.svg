<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The W that is also a rising line, on a rounded indigo tile. Same geometry
    as WylthMark in src/components/logo.tsx, scaled from the 24px master and
    with the stroke thickened 2 -> 2.6 so the weight reads the same at tile
    size. No gradient: the mark has to hold at 16px in a tab strip, which is
    where a gradient turns to mud.
  -->
  <rect width="32" height="32" rx="8" fill="#3c4bd6"/>
  <g fill="none" stroke="#f2b90f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 11 L11 23 L17 15 L23 19 L28.5 6.5"/>
  </g>
  <circle cx="28.5" cy="6.5" r="2.6" fill="#f2b90f"/>
</svg>
