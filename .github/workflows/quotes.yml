name: Refresh quotes

# Prices and filings move at completely different speeds, and until this
# existed only the filings had a scheduler.
#
# `ingest.yml` runs the fundamentals pass nightly, and that pass does not touch
# `price`, `changePercent` or `priceUpdatedAt` — only `refreshQuotes` writes
# those, and nothing ran it on a schedule. So the dashboard's movers and sector
# heatmap were frozen at whenever somebody last ran `npm run quotes` by hand,
# which is why the same five risers sat there for eleven days.
#
# The scheduled refresh no longer runs here. It runs on Railway, as the
# `quote-refresh` cron service beside the app (weekdays at 21:30 UTC), using
# the same provider keys the live site uses. This workflow is kept only for a
# refresh started by hand.
#
# Why it moved: this workflow read its own copies of the provider keys from
# the repo's Actions secrets, separate from the keys the site proves work every
# day. For weeks it brought in no current price while the site quoted fine.
# Keeping one set of keys in one place fixes that. A second scheduler writing
# the same rows would only compete with the first for the same free rate
# limits.
#
# Weekdays only, now that a stored price carries its own date: a weekend run
# re-fetches Friday's close, and the dashboard no longer mistakes a Friday
# close read on Monday for a stale one.
#
# Runs outside Railway's private network, so DATABASE_URL must be the public
# connection string — the internal .railway.internal host does not resolve here.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many symbols to refresh. Blank = whole universe."
        required: false
        default: ""

# A run started while the previous one is still going would have both passes
# writing the same rows, and the free price tiers are rate limited enough that
# two at once mostly produces failures.
concurrency:
  group: refresh-quotes
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    # The whole universe against a free price plan takes roughly ten minutes;
    # this leaves room for a slow provider without hanging for an hour.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the Node that generates package-lock.json locally.
          # npm 11 (Node 24) records esbuild's per-platform binaries in a form
          # npm 10 (Node 22) rejects outright — "Missing: @esbuild/linux-x64
          # from lock file" — which failed `npm ci` on every scheduled run
          # from the day these workflows were added until this was changed.
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Refresh stored quotes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          ENABLE_YAHOO_FALLBACK: ${{ secrets.ENABLE_YAHOO_FALLBACK }}
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            npm run quotes -- --limit ${{ github.event.inputs.limit }}
          else
            npm run quotes
          fi
